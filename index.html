<style>
/* ===== UOL theme — colours taken from the company logo (leaf green + cart blue) ===== */
:root{
  --bg:#f1f8f5; --card:#fff; --ink:#12281f; --muted:#587068; --line:#dcebe4;
  --deep:#13682f; --green:#1a8a3c; --green2:#34a94b; --leaf:#7ccb7a; --green-soft:#e5f6ea;
  --teal:#0b96b8; --blue:#0a7694; --blue-soft:#e1f4fa; --sky:#8fd6f5;
  --amber:#b45309; --amber-soft:#fef3c7; --red:#b91c1c; --red-soft:#fee2e2; --purple:#6d3fa8;
  --brand:linear-gradient(135deg,#1a8a3c 0%,#34a94b 48%,#0b96b8 100%);
  --shadow:0 1px 2px rgba(15,70,45,.06),0 8px 22px -12px rgba(15,70,45,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg) radial-gradient(900px 380px at 100% -8%,rgba(11,150,184,.10),transparent 70%),radial-gradient(800px 360px at 12% -6%,rgba(52,169,75,.10),transparent 70%) no-repeat fixed}
::selection{background:#bfe9c9}
*::-webkit-scrollbar{height:10px;width:10px}*::-webkit-scrollbar-thumb{background:#bcd8cb;border-radius:8px}*::-webkit-scrollbar-thumb:hover{background:#97c3ae}

/* ---- top bar ---- */
.topbar{position:relative;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:8px 22px;background:#fff;box-shadow:0 2px 14px -6px rgba(15,70,45,.25);z-index:5}
.topbar:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--brand)}
.brand{display:flex;gap:12px;align-items:center}
.logo-img{height:62px;width:auto;display:block}
.brand b{display:block;font-size:17px;color:var(--deep);letter-spacing:.2px;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-bottom:4px}
.chip{border-radius:999px;padding:6px 14px;font-weight:600;font-size:12.5px;border:1px solid}
.chip.db{background:var(--blue-soft);color:var(--blue);border-color:#b7e3f1}
.chip.clock{background:var(--green-soft);color:var(--deep);border-color:#bfe5c9;font-family:ui-monospace,Menlo,Consolas,monospace}
.loginas{display:flex;align-items:center;gap:10px;background:var(--green-soft);border:1px solid #bfe5c9;border-radius:999px;padding:4px 5px 4px 14px}
.loginas span{font-weight:700;color:var(--deep);font-size:11.5px;letter-spacing:.5px}
.loginas select{border:1px solid #cfe6d8;border-radius:999px;padding:7px 14px;font-size:14px;background:#fff;min-width:230px;color:var(--ink)}

/* ---- layout + sidebar ---- */
.app{display:flex;align-items:flex-start;min-height:calc(100vh - 70px)}
nav#tabs{width:244px;flex:none;position:sticky;top:0;align-self:stretch;background:linear-gradient(180deg,#0d4f2c 0%,#0c5b45 52%,#0a5f78 100%);padding:16px 12px;display:flex;flex-direction:column;gap:3px;box-shadow:4px 0 18px -10px rgba(7,50,40,.5)}
nav#tabs:before{content:"MAIN MENU";color:#9fd8bd;font-size:11px;font-weight:700;letter-spacing:1.4px;padding:2px 12px 10px}
nav#tabs button{display:flex;align-items:center;gap:11px;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;color:#d6efe3;cursor:pointer;transition:background .15s,transform .15s}
nav#tabs button:hover{background:rgba(255,255,255,.11)}
nav#tabs button.on{background:linear-gradient(90deg,#34a94b,#0b96b8);color:#fff;box-shadow:0 6px 14px -6px rgba(0,0,0,.45)}
nav#tabs button i{font-style:normal;width:22px;text-align:center;font-size:15px}
main{flex:1;min-width:0;padding:22px 26px 48px}
@media(max-width:800px){
  .app{flex-direction:column}main{padding:14px 12px 36px}
  nav#tabs{width:100%;position:static;flex-direction:row;overflow-x:auto;padding:8px;gap:6px;box-shadow:none}
  nav#tabs:before{display:none}nav#tabs button{white-space:nowrap;padding:9px 12px}
  .topbar{padding:8px 12px}.logo-img{height:44px}.loginas select{min-width:0}
}

/* ---- cards, tiles ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:18px;color:var(--deep);letter-spacing:.1px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--deep)}
.sub{color:var(--muted);margin:0 0 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.tile{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px)}
.tile:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#1a8a3c,#7ccb7a)}
.tile:nth-child(even):before{background:linear-gradient(90deg,#0b96b8,#8fd6f5)}
.tile small{color:var(--muted);display:block;font-weight:600}
.tile b{font-size:25px;color:var(--deep);display:block;margin-top:2px}
.tile:nth-child(even) b{color:var(--blue)}

/* ---- forms ---- */
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;letter-spacing:.2px}
select,input[type=text],input[type=date],input[type=number],input[type=password],input[type=file]{border:1px solid #cfe0d7;border-radius:10px;padding:8px 11px;font-size:14px;background:#fff;min-width:200px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
select:focus,input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(11,150,184,.18)}
input[type=checkbox]{accent-color:var(--green);width:15px;height:15px;min-width:0}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"▸ ";color:var(--teal)}details[open]>summary:before{content:"▾ "}

/* ---- buttons ---- */
button.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px -8px rgba(15,100,70,.7);transition:filter .15s,transform .15s}
button.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
button.btn.alt{background:#fff;color:var(--green);border:1px solid #9ad2ac;box-shadow:none}
button.btn.alt:hover{background:var(--green-soft);filter:none}
button.btn.danger{background:#b91c1c;box-shadow:none}
button.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
button.mini{border:1px solid #bfe0cb;background:#fff;border-radius:8px;padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer;margin-right:6px;color:var(--green)}
button.mini:hover{background:var(--green-soft)}
button.mini.d{color:#991b1b;border-color:#fecaca}button.mini.d:hover{background:var(--red-soft)}button.mini:disabled{opacity:.4;cursor:not-allowed}

/* ---- tables ---- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #e8f1ec;vertical-align:top}
th{background:linear-gradient(180deg,#eef8f3,#e4f2ee);font-size:11.5px;color:var(--deep);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:2px solid #cfe5da}
tbody tr:nth-child(even) td{background:#fafdfb}
tbody tr:hover td{background:#eef8f2}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:800;background:#e8f6ee!important;color:var(--deep);border-top:2px solid #bfe0cb}

/* ---- badges, notes ---- */
.badge{display:inline-block;border-radius:999px;padding:2px 11px;font-weight:700;font-size:12px}
.b-give{background:var(--green-soft);color:#166534}.b-partial{background:var(--amber-soft);color:var(--amber)}
.b-posted{background:#dcf5e3;color:#166534}.b-in_transit{background:var(--blue-soft);color:var(--blue)}.b-draft,.b-closed{background:#e8edeb;color:#3b4a44}.b-ordered{background:var(--blue-soft);color:var(--blue)}.b-dispatched{background:var(--blue-soft);color:var(--blue)}.b-cancelled{background:#e8edeb;color:#3b4a44}
.b-do_not_give{background:var(--red-soft);color:var(--red)}.b-decided{background:var(--blue-soft);color:var(--blue)}.b-received{background:var(--green-soft);color:#166534}
.note{border-radius:12px;padding:10px 14px;margin:10px 0;border-left:4px solid}
.note.info{background:var(--blue-soft);color:#075e78;border-color:var(--teal)}.note.warn{background:var(--amber-soft);color:#78350f;border-color:#f59e0b}
.note.err{background:var(--red-soft);color:#7f1d1d;border-color:#ef4444}.note.ok{background:var(--green-soft);color:#14532d;border-color:var(--green2)}
.muted{color:var(--muted)}

/* ---- overlay, toast, login ---- */
#ov{position:fixed;inset:0;background:rgba(8,45,35,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20}
#ov .box{background:#fff;border-radius:18px;padding:22px;width:min(440px,92vw);max-height:90vh;overflow:auto;box-shadow:0 24px 60px -16px rgba(0,0,0,.5);background:#fff linear-gradient(90deg,#1a8a3c,#34a94b,#0b96b8) top/100% 5px no-repeat}
#ov .box label{margin-top:10px}#ov .box input,#ov .box select{width:100%}
#toast{position:fixed;right:18px;bottom:18px;max-width:380px;padding:12px 18px;border-radius:12px;color:#fff;display:none;z-index:30;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);font-weight:600}
#toast.show{display:block}#toast.ok{background:linear-gradient(135deg,#15803d,#0b96b8)}#toast.err{background:#991b1b}
.recv input[type=number]{min-width:0;width:90px;text-align:right}
.login-card{max-width:400px;margin:36px auto;text-align:center;padding:26px 26px 24px;position:relative;overflow:hidden}
.login-card:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--brand)}
.login-card .login-logo{width:230px;max-width:80%;height:auto;margin:6px auto 4px;display:block}
.login-card label,.login-card input{text-align:left}
.login-card input{width:100%}
#tabs button,.btn,.mini,.badge{user-select:none;-webkit-user-select:none}
</style>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US', {maximumFractionDigits: 2});
const norm = s => String(s ?? '').trim().replace(/\s+/g, ' ').toLowerCase();
const num = v => { const n = Number(String(v).replace(/,/g, '').trim()); return Number.isFinite(n) ? n : NaN; };
const today = () => new Date().toLocaleDateString('en-CA', {timeZone: TZ});
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };

let db, allLocations = [], locations = [], products = [];

let realClient = null;
function makeClient(role, locationId) {
  if (REAL_LOGIN) {
    if (!realClient) realClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth: {persistSession: true, autoRefreshToken: true}});

  return supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {persistSession: false, autoRefreshToken: false},
    global: {headers: {'x-demo-role': role, 'x-demo-location': locationId || ''}}
  });
}
async function fetchAll(build) {   // pages of 1000 rows; after a full first page the next pages are requested four at a time
  const step = 1000, first = await build(0, step - 1); if (first.error) throw first.error;
  let out = first.data; if (out.length < step) return out;
  for (let from = step; ; from += 4 * step) {
    const res = await Promise.all([0, 1, 2, 3].map(i => build(from + i * step, from + (i + 1) * step - 1)));
    for (const r of res) { if (r.error) throw r.error; out = out.concat(r.data); if (r.data.length < step) return out; }
  }
}
function toast(msg, type = 'ok') {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 6000);
}
const note = (el, html, type = 'info') => { el.innerHTML = html ? `<div class="note ${type}">${html}</div>` : ''; };

// ---------- spreadsheet helpers ----------
async function readSheet(file) {
  const wb = XLSX.read(await file.arrayBuffer(), {type: 'array', cellDates: true});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: '', raw: false, dateNF: 'yyyy-mm-dd'});
}
async function readTable(file, ...mustHave) {
  const wb = XLSX.read(await file.arrayBuffer(), {type: 'array', cellDates: true});
  for (const sn of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header: 1, defval: '', raw: false, dateNF: 'yyyy-mm-dd'});
    for (let h = 0; h < Math.min(aoa.length, 15); h++) {
      const hdr = aoa[h].map(c => String(c).trim());
      if (mustHave.every(m => hdr.some(c => norm(c) === norm(m)))) {
        return aoa.slice(h + 1).filter(r => r.some(c => String(c).trim() !== '')).map(r => { const o = {}; hdr.forEach((c, i) => { if (c) o[c] = r[i] ?? ''; }); return o; });
      }
    }
  }
  throw new Error('Could not find a header row with "' + mustHave.join('", "') + '" in any sheet of this file.');
}
function pick(row, ...names) {
  const k = Object.keys(row).find(k => names.some(n => norm(n) === norm(k)));
  return k === undefined ? '' : row[k];
}
function downloadSheet(filename, aoa) {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Sheet1');
  XLSX.writeFile(wb, filename);
}
const productMap = () => { const m = new Map(); products.forEach(p => m.set(norm(p.name), p)); return m; };

// Reads rows with a product name + quantity. Returns matched items and any problems found.
function matchRows(rows, qtyNames) {
  const map = productMap(), items = [], errors = [], unmatched = new Set();
  rows.forEach((r, i) => {
    const name = String(pick(r, 'Product Name', 'Product')).trim();
    const rawQty = pick(r, ...qtyNames);
    if (!name && String(rawQty).trim() === '') return;
    const rowNo = i + 2;
    if (!name) { errors.push(`Row ${rowNo}: product name is missing.`); return; }
    const qty = num(rawQty);
    if (!Number.isFinite(qty) || qty < 0) { errors.push(`Row ${rowNo}: "${name}" has an invalid quantity.`); return; }
    const p = map.get(norm(name));
    if (!p) { unmatched.add(name); return; }
    items.push({product: p, qty, row: r, rowNo});
  });
  return {items, errors, unmatched: [...unmatched]};
}
function problemHtml(res) {
  let h = '';
  if (res.unmatched.length) h += `<b>Products not found in the product master (${res.unmatched.length}):</b><br>${res.unmatched.map(esc).join('<br>')}<br>`;
  if (res.errors.length) h += `<b>Row errors:</b><br>${res.errors.slice(0, 15).map(esc).join('<br>')}${res.errors.length > 15 ? '<br>…' : ''}`;
  return h;
}

async function boot() {
  setInterval(tick, 1000); tick();
  if (SUPABASE_URL.startsWith('PASTE') || SUPABASE_ANON_KEY.startsWith('PASTE')) {
    $('#view').innerHTML = `<div class="card"><h2>Setup required</h2><p>Open <b>index.html</b>, and replace <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top with the values from Supabase → Project Settings → API.</p></div>`;
    return;
  }
  if (REAL_LOGIN) { db = makeClient(); $('.loginas').style.display = 'none'; return realStart(); }
  try {
    db = makeClient('super_admin', null);
    const {data, error} = await db.from('locations').select('*').eq('is_active', true).order('type').order('name');
    if (error) throw error;
    if (!data.length) currentTab = 'master', mdTab = 'locations';   // empty database: open Master Data so locations can be imported
    allLocations = data;
  } catch (e) {
    $('#view').innerHTML = `<div class="card"><h2>Cannot connect to the database</h2><div class="note err">${esc(e.message)}</div><p class="muted">Check the URL and key, and make sure both SQL files were run in order.</p></div>`;
    return;
  }
  buildLoginAs();
  await applySession();
}
async function realStart() {
  const {data} = await db.auth.getSession();
  if (!data.session) return renderLogin();
  const pr = await db.from('profiles').select('full_name,role,location_id,is_active').eq('id', data.session.user.id).maybeSingle();
  if (pr.error || !pr.data || !pr.data.is_active) {
    $('#view').innerHTML = `<div class="card"><h2>No access</h2><div class="note err">This account has no active profile. Ask the Super Admin to set up your role.</div><button class="btn" id="so">Sign out</button></div>`;
    $('#so').onclick = signOut; return;
  }
  session = {role: pr.data.role, locationId: pr.data.location_id, name: pr.data.full_name};
  const l = await db.from('locations').select('*').eq('is_active', true).order('type').order('name');
  if (l.error) { toast(l.error.message, 'err'); return; }
  locations = allLocations = l.data;
  const p = await db.from('products').select('*').order('name');
  if (p.error) { toast(p.error.message, 'err'); return; }
  products = p.data;
  if (!$('#whoami')) $('.chips').insertAdjacentHTML('beforeend', `<span class="chip db" id="whoami">${esc(session.name)} · ${esc(session.role.replace(/_/g, ' '))}</span><button class="btn alt" id="soBtn">Sign out</button>`);
  $('#soBtn').onclick = signOut;
  buildTabs();
  const visible = TABS.filter(t => tabOk(t));
  if (!visible.some(t => t.id === currentTab)) currentTab = 'dashboard';
  showTab(currentTab);
}
async function signOut() { await db.auth.signOut(); location.reload(); }

function friendlyError(e, id) {
  const raw = String((e && e.message) || e); let title = 'This page could not be loaded', hint = 'Please try again. If it keeps happening, tell the admin and mention the time shown below.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(raw)) { title = 'No connection to the database'; hint = 'Check your internet connection and try again.'; }
  else if (/statement timeout|canceling statement/i.test(raw)) { title = 'The database took too long to answer'; hint = 'Please try again in a moment. If it keeps happening, the admin should check the database speed.'; }
  else if (/Run uol_|Run the latest SQL|is missing|schema cache|Could not find the (table|function)/i.test(raw)) { title = 'Database setup is not complete'; hint = raw; }
  else if (/is null|is undefined|Cannot read|can't access/i.test(raw)) hint = 'The page changed while it was loading. Please try again.';
  return `<div class="card" style="max-width:680px"><h3 style="margin-top:0">${esc(title)}</h3><p class="sub">${esc(hint)}</p><div class="row"><button class="btn" id="errRetry">Try again</button></div>
    <details style="margin-top:12px"><summary class="muted" style="cursor:pointer">Technical details</summary><pre style="white-space:pre-wrap;font-size:12px;background:#f3f4f6;padding:10px;border-radius:8px;margin-top:8px">${esc(raw)}\n${new Date().toLocaleString('en-GB', {timeZone: TZ})} · ${esc(id)}</pre></details></div>`;
}
async function showTab(id) {
  const my = ++renderSeq, live = () => my === renderSeq;
  currentTab = id; clearInterval(liveTimer); DC.at = 0;
  $('#tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === id));
  const v = $('#view'); v.innerHTML = loading;
  // the page code gets a guarded handle: once a newer page has started, everything the old one still tries to draw is ignored
  const guarded = new Proxy(v, {
    get: (t, k) => { const x = t[k]; return typeof x === 'function' ? (...a) => (live() ? x.apply(t, a) : undefined) : x; },
    set: (t, k, val) => { if (live()) t[k] = val; return true; }
  });
  try { await TABS.find(t => t.id === id).render(guarded); }
  catch (e) {
    if (!live()) return;   // an older page failing because we already moved on is not an error for the user
    console.error(e); v.innerHTML = friendlyError(e, id); const r = $('#errRetry'); if (r) r.onclick = () => showTab(id); return;
  }
  if (!live()) return;
  if (FC_TABS.includes(id) && isCentral()) {
    v.insertAdjacentHTML('afterbegin', '<div id="fcH"></div>');
    fcHealth($('#fcH')).catch(() => { const h = $('#fcH'); if (h) h.remove(); });
    liveWatch(id);
  }
}

// ---------- ONE live demand engine shared by Distribution, Reorder and Import planning ----------
// forecast_live (see uol_live_forecast_engine.sql) gives, per sales point x product, an average daily sales that
//   * counts recent days more (half-life FC.hl days), so a weak day lowers and a strong day raises the forecast at once,
//   * skips days the product had no stock (stock-out) and days the sales point sent no sales data.
const FC = {hl: 4, days: 60};

// ---------- open purchase orders as dated arrivals, and a day-by-day stock projection ----------
// Goods on an open PO are NOT stock until they arrive. The projection runs the current stock down at the live daily demand,
// adds each PO on its expected date, and reports every period in which the shelves would be empty before the PO arrives.
async function loadArrivals() {
  const r = await db.from('purchase_orders').select('po_no,po_date,expected_date,status,po_lines(product_id,ordered_qty,received_qty)').in('status', ['ordered', 'partial']);
  if (r.error) throw need5(r.error);
  const m = new Map();
  r.data.forEach(po => (po.po_lines || []).forEach(l => { const bal = Number(l.ordered_qty) - Number(l.received_qty); if (!(bal > 0)) return;
    if (!m.has(l.product_id)) m.set(l.product_id, []); m.get(l.product_id).push({po: po.po_no, date: po.expected_date, base: po.po_date, qty: bal}); }));
  return m;
}
// arrivals: [{date, qty, po}] (dates already filled in). Returns the final run-out date, the empty-shelf periods and the stock on any later day.
function projectStock(onhand, D, arrivals, td) {
  const evs = arrivals.map(a => ({t: Math.max(0, diffDays(td, a.date)), qty: a.qty, po: a.po})).sort((x, y) => x.t - y.t);
  let t = 0, S = Math.max(0, onhand); const gaps = []; let tail = null;
  for (const e of evs) {
    const use = D * (e.t - t);
    if (D > 0 && S - use < 0) { const out = t + S / D; gaps.push({from: addDays(td, Math.floor(out)), to: addDays(td, e.t), days: e.t - out, units: D * (e.t - out), po: e.po}); S = 0; } else S -= use;
    S += e.qty; t = e.t;
  }
  const runOut = D > 0 ? addDays(td, Math.floor(t + S / D)) : null;
  const projAt = d => { let tt = 0, ss = Math.max(0, onhand); for (const e of evs) { if (e.t > d) break; ss = Math.max(0, ss - D * (e.t - tt)) + e.qty; tt = e.t; } return Math.max(0, ss - D * (d - tt)); };
  return {runOut, gaps, gapDays: gaps.reduce((a, g) => a + g.days, 0), projAt};
}

const fcLoad = td => rpcAll('forecast_live', {p_to: td, p_days: FC.days, p_halflife: FC.hl}, 'loc_id', 'prod_id');
const fcRow = r => ({sold: Number(r.sold), tracked: r.tracked_days, avail: r.avail_days, so: r.so_days, unrep: r.unrep_days, w: Number(r.wavg), last: r.last_sale});
const FC_ZERO = {sold: 0, tracked: 0, avail: 0, so: 0, unrep: 0, w: 0, last: null};
// daily demand of one sales point x product; with "ignore stock-out" the live weighted figure is used
const fcBase = (b, ignoreStockout) => {
  if (!ignoreStockout) return b.sold / WINDOW_DAYS;
  const need = Math.min(7, Math.max(1, b.tracked - b.unrep));   // reported days we would like to see
  return b.avail > 0 ? b.w * Math.min(1, b.avail / need) : 0;
};

function persistUi(scope, ids) {   // keeps screen settings across the automatic refresh

// forecast data health: a sales point that stops sending sales data makes its forecast old
async function fcHealth(el) {
  const td = today(), yest = addDays(td, -1), sps = locations.filter(l => l.type === 'sales_point');
  const rows = await rpcAll('sales_coverage', {p_from: addDays(td, -14), p_to: td}, 'loc_id', 'd');
  const by = new Map(); rows.forEach(r => { if (!by.has(r.loc_id)) by.set(r.loc_id, new Set()); by.get(r.loc_id).add(r.d); });
  const late = [], gaps = [];
  sps.forEach(l => { const s0 = by.get(l.id) || new Set(), last = [...s0].sort().pop(); if (!last || last < yest) late.push(`${l.name} (${last ? 'last sales ' + last : 'no sales data'})`);
    let miss = 0; for (let i = 1; i <= 14; i++) if (!s0.has(addDays(td, -i))) miss++; if (miss && last) gaps.push(`${l.name}: ${miss} day${miss === 1 ? '' : 's'}`); });
  const hl = (FC_HL.find(x => x[0] === FC.hl) || [0, FC.hl + '-day'])[1];
  el.className = 'note ' + (late.length ? 'warn' : 'ok'); el.style.margin = '0 0 12px';
  el.innerHTML = `<b>🟢 Live forecast</b> · responsiveness: ${esc(hl)} · updated ${new Date().toLocaleTimeString('en-GB', {timeZone: TZ})}<br>` + (late.length
    ? `⚠ <b>${late.length} sales point${late.length === 1 ? '' : 's'} not reported up to ${yest}:</b> ${late.map(esc).join('; ')}. Their forecast still uses their last reported days; upload the missing sales to bring it up to date.`
    : `All ${sps.length} sales points reported up to ${yest}.`)
    + (gaps.length ? `<br><span class="muted">Days with no sales data in the last 14 days are skipped (not counted as zero sales): ${gaps.map(esc).join('; ')}.</span>` : '');
}

const dataVersion = async () => { try { const r = await db.rpc('data_version'); return r.error ? null : r.data; } catch (e) { return null; } };
// ---------- speed: results shared by all screens while the data has not changed ----------
const DC = {ver: null, at: 0, map: new Map()};
function dcReset() { DC.map.clear(); DC.ver = null; DC.at = 0; }
async function dcSync() {
  if (Date.now() - DC.at < 4000) return;
  const v = await dataVersion(); DC.at = Date.now();
  if (v == null || v !== DC.ver) { DC.map.clear(); DC.ver = v; }
}
async function dc(key, loader) {
  await dcSync();
  if (!DC.map.has(key)) DC.map.set(key, loader().catch(e => { DC.map.delete(key); throw e; }));
  return DC.map.get(key);
}
async function liveWatch(id) {

    const nv = await dataVersion(); if (nv == null || nv === liveVer || seq !== renderSeq) return;

  }, 30000);
}

    <p class="sub">Upload the opening inventory for each warehouse and sales point once. Daily sales are counted from the opening date onward.</p>
    <div class="row">
      <div><label>Location</label><select id="opLoc">${locations.map(l => `<option value="${l.id}">${esc(l.name)} (${l.type === 'warehouse' ? 'Warehouse' : 'Sales Point'})</option>`).join('')}</select></div>
      <div><label>Opening date</label><input type="date" id="opDate" value="${today()}"></div>
      <div><label>Opening stock sheet (.xlsx)</label><input type="file" id="opFile" accept=".xlsx,.xls,.csv"></div>
      <button class="btn" id="opGo">Upload Opening Stock</button>
      <button class="btn alt" id="opTpl">Download Template</button>
    </div><div id="opMsg"></div></div><div id="opStatus"></div>`;
  $('#opTpl').onclick = () => downloadSheet('Opening_Stock_Template.xlsx', [['Product Name', 'Opening Qty'], [products[0]?.name || 'Product name', 100]]);
  const status = async () => {
    const led = await fetchAll((a, b) => db.from('stock_ledger').select('location_id').eq('entry_type', 'opening').order('id').range(a, b));
    const c = new Map(); led.forEach(r => c.set(r.location_id, (c.get(r.location_id) || 0) + 1));
    const fresh = (await db.from('locations').select('id,opening_date')).data || [];
    $('#opStatus').innerHTML = `<div class="card"><h3>Opening stock status</h3><div class="tablewrap"><table><thead><tr><th>Location</th><th>Type</th><th class="n">Products with opening stock</th><th>Opening date</th></tr></thead><tbody>
      ${locations.map(l => `<tr><td>${esc(l.name)}</td><td>${l.type === 'warehouse' ? 'Warehouse' : 'Sales Point'}</td><td class="n">${c.get(l.id) || 0}</td><td>${(fresh.find(x => x.id === l.id) || {}).opening_date || '—'}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  };
  $('#opGo').onclick = async () => {
    const msg = $('#opMsg'), btn = $('#opGo'); note(msg, '');
    try {
      const f = $('#opFile').files[0]; if (!f) return note(msg, 'Please choose the opening stock sheet first.', 'warn');
      const locId = $('#opLoc').value;
      const res = matchRows(await readSheet(f), ['Opening Qty', 'Qty', 'Quantity']);
      if (res.unmatched.length || res.errors.length) return note(msg, problemHtml(res), 'err');
      const agg = new Map(); res.items.forEach(i => agg.set(i.product.id, (agg.get(i.product.id) || 0) + i.qty));
      if (!agg.size) return note(msg, 'The sheet contains no rows.', 'warn');
      const existing = await fetchAll((a, b) => db.from('stock_ledger').select('product_id').eq('entry_type', 'opening').eq('location_id', locId).order('id').range(a, b));
      const dup = existing.filter(r => agg.has(r.product_id)).map(r => prodName(r.product_id));
      if (dup.length) return note(msg, `<b>Opening stock already exists for ${dup.length} product(s) at this location:</b><br>${dup.slice(0, 10).map(esc).join('<br>')}<br>Use a stock adjustment instead of uploading opening stock again.`, 'err');
      btn.disabled = true;
      const rows = [...agg].map(([pid, qty]) => ({location_id: locId, product_id: pid, entry_date: $('#opDate').value, entry_type: 'opening', qty}));
      for (let i = 0; i < rows.length; i += 500) { const {error} = await db.from('stock_ledger').insert(rows.slice(i, i + 500)); if (error) throw error; }
      const up = await db.from('locations').update({opening_date: $('#opDate').value}).eq('id', locId).select();
      audit('upload', 'stock_ledger', `Opening stock: ${rows.length} products at ${locName(locId)} (date ${$('#opDate').value})`, {location: locName(locId), products: rows.length});
      toast(`Opening stock saved for ${rows.length} products.`);
      note(msg, `Saved ${rows.length} products.${up.data && up.data.length ? '' : ' The opening date could not be saved with this role; log in as Super Admin or Admin to set it.'}`, 'ok');
      await status();
    } catch (e) { note(msg, esc(e.message || e), 'err'); }
    finally { btn.disabled = false; }
  };
  await status();
}

  v.innerHTML = `<div class="card"><h2>Daily Sales</h2>
    <p class="sub">Upload sales with the columns <b>Date</b>, <b>Product Name</b> and <b>Sales Qty</b>. Uploading a date again replaces that day's figures for the product.</p>
    <div class="row">
      <div><label>Sales point</label><select id="slLoc">${sps.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div>
      <div><label>Sales sheet (.xlsx)</label><input type="file" id="slFile" accept=".xlsx,.xls,.csv"></div>

      <button class="btn alt" id="slTpl">Download Template</button>
    </div><div id="slMsg"></div></div><div id="slRecent"></div>`;
  if (isCentral()) bulkSales(v, sps);
  $('#slTpl').onclick = () => downloadSheet('Daily_Sales_Template.xlsx', [['Date', 'Product Name', 'Sales Qty'], [today(), products[0]?.name || 'Product name', 5]]);
  const recent = async () => {
    const loc = $('#slLoc').value;
    const rows = await salesSince(addDays(today(), -13), loc);
    const byDate = new Map(); rows.forEach(r => { const o = byDate.get(r.sale_date) || {n: 0, u: 0}; o.n++; o.u += Number(r.qty); byDate.set(r.sale_date, o); });
    const dates = [...byDate.keys()].sort().reverse();
    $('#slRecent').innerHTML = `<div class="card"><h3>Last 14 days — ${esc(locName(loc))}</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th class="n">Products sold</th><th class="n">Units sold</th></tr></thead><tbody>
      ${dates.map(d => `<tr><td>${d}</td><td class="n">${byDate.get(d).n}</td><td class="n">${fmt(byDate.get(d).u)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No sales uploaded for this period.</td></tr>'}
      </tbody></table></div></div>`;
  };
  $('#slLoc').onchange = recent;
  $('#slGo').onclick = async () => {
    const msg = $('#slMsg'), btn = $('#slGo'); note(msg, '');
    try {
      const f = $('#slFile').files[0]; if (!f) return note(msg, 'Please choose the sales sheet first.', 'warn');
      const res = matchRows(await readSheet(f), ['Sales Qty', 'Qty', 'Quantity']);
      const agg = new Map(), t = today();
      res.items.forEach(i => {
        const d = String(pick(i.row, 'Date')).trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { res.errors.push(`Row ${i.rowNo}: date "${d}" is not valid (use yyyy-mm-dd).`); return; }
        if (d > t) { res.errors.push(`Row ${i.rowNo}: date ${d} is in the future.`); return; }
        const k = d + '|' + i.product.id; agg.set(k, (agg.get(k) || 0) + i.qty);
      });
      if (res.unmatched.length || res.errors.length) return note(msg, problemHtml(res), 'err');
      if (!agg.size) return note(msg, 'The sheet contains no rows.', 'warn');
      btn.disabled = true;
      const loc = $('#slLoc').value;
      const rows = [...agg].map(([k, qty]) => { const [d, pid] = k.split('|'); return {location_id: loc, product_id: pid, sale_date: d, qty}; });
      for (let i = 0; i < rows.length; i += 500) {
        const {error} = await db.from('daily_sales').upsert(rows.slice(i, i + 500), {onConflict: 'location_id,product_id,sale_date'});
        if (error) throw error;
      }
      const ds = rows.map(r => r.sale_date).sort();
      toast(`Sales saved: ${rows.length} rows.`);
      note(msg, `Saved ${rows.length} rows for ${esc(locName(loc))} (${ds[0]} to ${ds[ds.length - 1]}).`, 'ok');
      await recent();
    } catch (e) { note(msg, esc(e.message || e), 'err'); }
    finally { btn.disabled = false; }
  };
  await recent();
}

// ---------- bulk daily sales: one date, one workbook, one sheet per sales point ----------
function bulkSales(v, sps) {
  v.insertAdjacentHTML('afterbegin', `<div class="card"><h2>Daily Sales — All Sales Points (one file)</h2>
    <p class="sub">Pick the date, then upload one Excel file with <b>one sheet per sales point</b> (sheet name = sales point name; columns <b>Product Code</b>, <b>Product Name</b>, <b>Sales Data</b>).

    <div class="row"><div><label>Sales date</label><input type="date" id="bkDate" value="${today()}" max="${today()}"></div>
    <div><label>Workbook (.xlsx)</label><input type="file" id="bkFile" accept=".xlsx,.xls"></div>

  $('#bkGo').onclick = async () => {
    const msg = $('#bkMsg'), btn = $('#bkGo'); note(msg, '');
    try {
      const date = $('#bkDate').value, f = $('#bkFile').files[0];
      if (!date) return note(msg, 'Please choose the sales date.', 'warn');
      if (date > today()) return note(msg, 'The date cannot be in the future.', 'warn');
      if (!f) return note(msg, 'Please choose the workbook first.', 'warn');
      btn.disabled = true;
      const wb = XLSX.read(await f.arrayBuffer(), {type: 'array'});
      const bySku = new Map(products.filter(p => p.sku).map(p => [norm(p.sku), p])), byName = productMap();
      const spMatch = sn => {
        const n = norm(sn), strip = x => x.replace(/ outlet$/, '');
        let c = sps.filter(l => norm(l.name) === n);
        if (!c.length) c = sps.filter(l => strip(norm(l.name)) === strip(n) || norm(l.name).startsWith(n) || n.startsWith(norm(l.name)));
        return c.length === 1 ? c[0] : null;
      };
      const perSp = new Map(), errs = [], unmatchedSheets = [], unmatchedProd = new Set();
      for (const sn of wb.SheetNames) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {defval: '', raw: false});

        const m = new Map();
        rows.forEach((r, i) => {
          const code = String(pick(r, 'Product Code', 'Code')).trim(), name = String(pick(r, 'Product Name', 'Product')).trim();

          const prod = (code && bySku.get(norm(code))) || byName.get(norm(name));

      $('#bkOk').onclick = async () => {
        const b2 = $('#bkOk'); b2.disabled = true;

          const out = [];

          toast(`Sales saved for ${date}.`); note(msg, `Saved ${out.length} rows for ${sps.length} sales points on ${esc(date)}. Sales points or products not in the file were saved as 0.`, 'ok');
          await showTab('sales');
        } catch (e) { note(msg, esc(e.message || e), 'err'); b2.disabled = false; }
      };
    } catch (e) { note(msg, esc(e.message || e), 'err'); }
    finally { btn.disabled = false; }
  };
}

// ---------- shared: read a workbook with one sheet per sales point ----------
async function readBulk(file, sps, qtyNames) {
  const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
  const bySku = new Map(products.filter(p => p.sku).map(p => [norm(p.sku), p])), byName = productMap();
  const strip = x => x.replace(/ outlet$/, '');
  const spMatch = sn => { const n = norm(sn); let c = sps.filter(l => norm(l.name) === n);
    if (!c.length) c = sps.filter(l => strip(norm(l.name)) === strip(n) || norm(l.name).startsWith(n) || n.startsWith(norm(l.name))); return c.length === 1 ? c[0] : null; };
  const perSp = new Map(), errs = [], badSheets = [], badProd = new Set();
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {defval: '', raw: false}); if (!rows.length) continue;
    const sp = spMatch(sn); if (!sp) { badSheets.push(sn); continue; }
    if (perSp.has(sp.id)) { errs.push(`Two sheets match "${sp.name}" (${sn}).`); continue; }
    const m = new Map();
    rows.forEach((r, i) => {
      const code = String(pick(r, 'Product Code', 'Code')).trim(), name = String(pick(r, 'Product Name', 'Product')).trim(), raw = String(pick(r, ...qtyNames)).trim();
      if (!code && !name) return;
      const q = raw === '' ? 0 : num(raw);
      if (!Number.isFinite(q) || q < 0) return errs.push(`${sn}, row ${i + 2}: invalid quantity for "${name || code}".`);
      const prod = (code && bySku.get(norm(code))) || byName.get(norm(name));
      if (!prod) return badProd.add(`${name || code} (${sn})`);
      m.set(prod.id, (m.get(prod.id) || 0) + q);
    });
    perSp.set(sp.id, m);
  }
  const problems = [];
  if (badSheets.length) problems.push(`<b>Sheets that do not match any sales point (${badSheets.length}):</b><br>${badSheets.map(esc).join('<br>')}`);
  if (badProd.size) problems.push(`<b>Products not found in the product master (${badProd.size}):</b><br>${[...badProd].slice(0, 20).map(esc).join('<br>')}${badProd.size > 20 ? '<br>…' : ''}`);
  if (errs.length) problems.push(`<b>Errors:</b><br>${errs.slice(0, 15).map(esc).join('<br>')}`);
  return {perSp, problems};
}

// ============================ DISTRIBUTION & FORECASTING ============================
// Supply = ceil(avg daily sales x (delivery gap + buffer) - current stock); when warehouse stock is short it is shared by sales rate.
// ---------- Phase 3 helpers: ABC, buffer rules, seasonal events ----------
const ABC_DAYS = 90, CLS_BADGE = {A: 'b-give', B: 'b-partial', C: 'b-dispatched', X: 'b-cancelled'};
const RPC_CACHED = new Set(['forecast_live', 'sales_agg', 'sales_coverage', 'sales_sum']);
async function rpcAll(fn, args, ...cols) {
  const run = async () => {
    try { return await fetchAll((a, b) => { let q = db.rpc(fn, args); cols.forEach(c => q = q.order(c)); return q.range(a, b); }); }
    catch (e) { throw new Error(['42P01', 'PGRST205', 'PGRST202'].includes(e.code) ? `The database function "${fn}" is missing. Run the latest SQL scripts (uol_live_forecast_engine.sql, then uol_performance.sql) in the Supabase SQL Editor.` : (e.message || e)); }
  };
  return RPC_CACHED.has(fn) ? dc(`${fn}|${JSON.stringify(args)}`, run) : run();
}
function abcCompute(qtyMap, aCut, bCut) {
  const act = products.filter(p => p.is_active), useVal = act.some(p => Number(p.mrp) > 0);
  const items = act.map(p => { const q = qtyMap.get(p.id) || 0; return {p, qty: q, value: useVal ? q * (Number(p.mrp) || 0) : q}; });
  const sold = items.filter(i => i.value > 0).sort((a, b) => b.value - a.value), total = sold.reduce((a, i) => a + i.value, 0), map = new Map();
  let cum = 0, rank = 0;
  sold.forEach(i => { const before = cum / total * 100; cum += i.value; i.cls = before < aCut ? 'A' : before < bCut ? 'B' : 'C'; i.share = i.value / total * 100; i.cum = cum / total * 100; i.rank = ++rank; map.set(i.p.id, i); });
  items.filter(i => i.value <= 0).forEach(i => { i.cls = 'X'; i.share = 0; i.cum = 100; i.rank = null; map.set(i.p.id, i); });
  return {map, useVal, total, items: [...sold, ...items.filter(i => i.value <= 0)]};
}
function ruleFor(rules, p, cls) {
  const out = {gap: null, buf: null};
  [['product', p.id], ['category', p.category], ['supplier', p.supplier], ['abc', cls]].forEach(([sc, key]) => {
    if (!key) return; const r = rules.find(x => x.scope === sc && norm(x.rule_key) === norm(key)); if (!r) return;

    const vals = [...ov.querySelectorAll('input[data-pid]')].map(i => ({product_id: i.dataset.pid, qty: Number(i.value)}));
    if (vals.some(x => !(x.qty >= 0))) return note($('#ovM'), 'Received quantities must be zero or greater.', 'err');
    if (!confirm('Confirm receipt?')) return; $('#rcOk').disabled = true;
    const {error} = await db.rpc('receive_stock_doc', {p_doc: d.id, p_lines: vals, p_note: $('#rcNote').value.trim() || null});
    if (error) { note($('#ovM'), esc(error.message), 'err'); $('#rcOk').disabled = false; return; }

  };
}

// ========================== INVENTORY MOVEMENT ==========================
// One place to see opening stock, sales, challans, transfers, returns and adjustments for every location.
const INV_TYPES = {opening: 'Opening Stock', sale: 'Sale', challan: 'Delivery Challan', transfer: 'Transfer', return: 'Return', adjustment: 'Adjustment', damage: 'QC Fail', count: 'Physical Count'};
const INV_TYPE_BADGE = {opening: 'b-give', sale: 'b-partial', challan: 'b-in_transit', transfer: 'b-in_transit', return: 'b-in_transit', adjustment: 'b-draft', damage: 'b-do_not_give', count: 'b-draft'};
const INV_STATUS = {posted: 'Posted', in_transit: 'In transit', received: 'Received', cancelled: 'Cancelled'};
const INV_STATUS_BADGE = {posted: 'b-posted', in_transit: 'b-in_transit', received: 'b-received', cancelled: 'b-closed'};
const INV_COLS = [['date', 'Date'], ['type', 'Type'], ['doc', 'Document No'], ['src', 'Source'], ['dst', 'Destination'], ['product', 'Product'], ['qty', 'Quantity'], ['rcv', 'Received Qty'], ['status', 'Status'], ['reason', 'Reason / Note']];
const INV_PRESET_KEY = 'uol_inv_presets_v1';
const invS = {};          // filter state is kept while the user moves between tabs
let invCache = {key: '', rows: [], warn: []};

const invChunk = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };
const invPresets = () => { try { return JSON.parse(localStorage.getItem(INV_PRESET_KEY) || '{}'); } catch (e) { return {}; } };
const invSavePresets = p => { try { localStorage.setItem(INV_PRESET_KEY, JSON.stringify(p)); } catch (e) { /* storage unavailable */ } };

function invRange(key) {
  const t = today(), [y, m] = t.split('-').map(Number), iso = d => d.toISOString().slice(0, 10);
  switch (key) {
    case 'today': return [t, t];
    case 'yesterday': return [addDays(t, -1), addDays(t, -1)];
    case '7': return [addDays(t, -6), t];
    case '30': return [addDays(t, -29), t];
    case 'month': return [`${y}-${String(m).padStart(2, '0')}-01`, t];
    case 'lastmonth': return [iso(new Date(Date.UTC(y, m - 2, 1))), iso(new Date(Date.UTC(y, m - 1, 0)))];
    case 'year': return [`${y}-01-01`, t];
  }
  return null;
}

async function invFetch(from, to) {
  const warn = [], rows = [];
  const safe = async (label, fn) => { try { return await fn(); } catch (e) { warn.push(`${label}: ${e.message || e}`); return []; } };
  const lines = async (table, idCol, cols, ids) => (await Promise.all(invChunk(ids, 100).map(part =>
    fetchAll((a, b) => db.from(table).select(cols).in(idCol, part).order('id').range(a, b))))).flat();

  const [opening, sales, challans, docs] = await Promise.all([
    safe('Opening stock', () => fetchAll((a, b) => db.from('stock_ledger').select('location_id,product_id,entry_date,qty').eq('entry_type', 'opening').gte('entry_date', from).lte('entry_date', to).order('id').range(a, b))),
    safe('Sales', () => fetchAll((a, b) => db.from('daily_sales').select('location_id,product_id,sale_date,qty').gte('sale_date', from).lte('sale_date', to).order('id').range(a, b))),
    safe('Delivery challans', () => fetchAll((a, b) => db.from('challans').select('*').gte('challan_date', from).lte('challan_date', to).order('id').range(a, b))),
    safe('Stock documents', () => fetchAll((a, b) => db.from('stock_docs').select('*').gte('doc_date', from).lte('doc_date', to).order('id').range(a, b)))
  ]);
  const [cLines, dLines] = await Promise.all([
    challans.length ? safe('Challan lines', () => lines('challan_lines', 'challan_id', 'challan_id,product_id,dispatch_qty,received_qty', challans.map(c => c.id))) : [],
    docs.length ? safe('Stock document lines', () => lines('stock_doc_lines', 'doc_id', 'doc_id,product_id,qty,received_qty', docs.map(d => d.id))) : []
  ]);

  opening.forEach(r => rows.push({date: r.entry_date, type: 'opening', docNo: '', src: null, dst: r.location_id, pid: r.product_id, qty: Number(r.qty), rcv: null, status: 'posted', reason: 'Opening balance'}));
  sales.forEach(r => rows.push({date: r.sale_date, type: 'sale', docNo: '', src: r.location_id, dst: null, pid: r.product_id, qty: Number(r.qty), rcv: null, status: 'posted', reason: ''}));
  const cMap = new Map(challans.map(c => [c.id, c]));
  cLines.forEach(l => { const c = cMap.get(l.challan_id); if (!c) return;
    rows.push({date: c.challan_date, type: 'challan', docNo: c.challan_no, src: c.from_location_id, dst: c.to_location_id, pid: l.product_id, qty: Number(l.dispatch_qty),
      rcv: c.status === 'received' ? Number(l.received_qty) : null, status: c.status === 'dispatched' ? 'in_transit' : c.status, reason: c.note || ''}); });
  const dMap = new Map(docs.map(d => [d.id, d]));
  dLines.forEach(l => { const d = dMap.get(l.doc_id); if (!d) return;
    const q = Number(l.qty), base = {date: d.doc_date, type: d.doc_type, docNo: d.doc_no, pid: l.product_id, status: d.status, reason: [d.reason, d.note].filter(Boolean).join(' — '), rcv: null};
    if (d.doc_type === 'transfer' || d.doc_type === 'return') rows.push({...base, src: d.location_id, dst: d.to_location_id, qty: q, rcv: l.received_qty == null ? null : Number(l.received_qty)});
    else if (d.doc_type === 'damage') rows.push({...base, src: d.location_id, dst: null, qty: Math.abs(q)});
    else rows.push(q >= 0 ? {...base, src: null, dst: d.location_id, qty: q} : {...base, src: d.location_id, dst: null, qty: Math.abs(q)});   // adjustment / count
  });
  return {rows, warn};
}

// How one row changes the stock of each location (cancelled documents change nothing; stock in transit is not yet at the destination).
function invEffects(r) {
  if (r.status === 'cancelled') return [];
  const q = r.qty;
  switch (r.type) {
    case 'opening': return [[r.dst, 'opening', q]];
    case 'sale': return [[r.src, 'sales', q]];
    case 'challan': case 'transfer': case 'return':
      return [[r.src, 'out', q]].concat(r.status === 'received' ? [[r.dst, 'in', r.rcv ?? q]] : []);
    default: return [r.dst ? [r.dst, 'adj', q] : [r.src, 'adj', -q]];
  }
}

async function renderInvMove(v) {
  const locs = locations.slice(), whs = locs.filter(l => l.type === 'warehouse'), sps = locs.filter(l => l.type === 'sales_point');

  v.innerHTML = `<div class="card"><h2>Inventory Movement</h2>
    <p class="sub">Opening stock, sales, delivery challans, transfers, returns, adjustments and QC fails of every location in one view. Filter by date, source and destination, then customise the filters and columns as needed.</p>
    <div class="row"><div><label>From date</label><input type="date" id="ivFrom"></div><div><label>To date</label><input type="date" id="ivTo"></div>
      <div><label>Quick range</label><select id="ivRange">${quick.map(q => `<option value="${q[0]}">${q[1]}</option>`).join('')}<option value="custom">Custom dates</option></select></div>
      <button class="btn alt" id="ivRefresh">Refresh data</button></div>
    <div class="row" style="margin-top:12px">
      <div><label>Source location</label><select id="ivSrc">${lo('<option value="__none">None (opening / stock found)</option>')}</select></div>
      <div><label>Destination location</label><select id="ivDst">${lo('<option value="__none">None (sale / write-off)</option>')}</select></div>
      <div><label>Any location (source or destination)</label><select id="ivAny">${lo('')}</select></div>
      <div><label>Status</label><select id="ivStatus"><option value="active">All except cancelled</option><option value="all">All including cancelled</option>${Object.entries(INV_STATUS).map(([k, n]) => `<option value="${k}">${n} only</option>`).join('')}</select></div>
      <div><label>Search document / reason</label><input type="text" id="ivQ" placeholder="Document no, reason or note"></div></div>
    <details id="ivAdv" style="margin-top:12px"><summary style="cursor:pointer;font-weight:700;color:var(--green)">Customise filters &amp; columns</summary>
      <div class="row" style="margin-top:10px"><div><label>Product name contains</label><input type="text" id="ivPq" placeholder="Type to filter"></div>
        <div><label>Minimum quantity</label><input type="number" id="ivMin" min="0" step="any" style="width:130px"></div></div>
      <label style="margin-top:12px">Movement types</label><div id="ivTypes" style="display:flex;flex-wrap:wrap;gap:6px 16px">${Object.entries(INV_TYPES).map(([k, n]) => `<label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink)"><input type="checkbox" data-t="${k}"> ${n}</label>`).join('')}</div>
      <label style="margin-top:12px">Columns to show (detail view)</label><div id="ivCols" style="display:flex;flex-wrap:wrap;gap:6px 16px">${INV_COLS.map(c => `<label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink)"><input type="checkbox" data-c="${c[0]}"> ${c[1]}</label>`).join('')}</div>
      <div class="row" style="margin-top:12px"><div><label>Saved filters</label><select id="ivPre" style="min-width:200px"></select></div>
        <button class="btn alt" id="ivPreLoad">Apply</button><button class="btn alt" id="ivPreSave">Save current filter</button><button class="btn alt" id="ivPreDel">Delete</button>
        <button class="btn alt" id="ivReset">Reset all</button></div></details></div>
    <div id="ivMsg"></div><div id="ivOut">${loading}</div>`;

  // ---- sync UI <-> state ----
  const pushUI = () => {
    $('#ivFrom').value = S.from; $('#ivTo').value = S.to; $('#ivRange').value = S.range; $('#ivSrc').value = S.src; $('#ivDst').value = S.dst; $('#ivAny').value = S.any;
    $('#ivStatus').value = S.status; $('#ivQ').value = S.q; $('#ivPq').value = S.pq; $('#ivMin').value = S.minq;
    $('#ivTypes').querySelectorAll('input').forEach(i => i.checked = S.types.includes(i.dataset.t));
    $('#ivCols').querySelectorAll('input').forEach(i => i.checked = S.cols.includes(i.dataset.c));
  };
  const pullUI = () => {
    Object.assign(S, {src: $('#ivSrc').value, dst: $('#ivDst').value, any: $('#ivAny').value, status: $('#ivStatus').value, q: $('#ivQ').value, pq: $('#ivPq').value, minq: $('#ivMin').value});
    S.types = [...$('#ivTypes').querySelectorAll('input')].filter(i => i.checked).map(i => i.dataset.t);
    S.cols = INV_COLS.map(c => c[0]).filter(k => [...$('#ivCols').querySelectorAll('input')].some(i => i.dataset.c === k && i.checked));
    S.limit = 200;
  };
  const fillPresets = () => { const p = invPresets(); $('#ivPre').innerHTML = Object.keys(p).length ? Object.keys(p).map(n => `<option>${esc(n)}</option>`).join('') : '<option value="">No saved filters</option>'; };

  // ---- filtering ----
  const matchLoc = (id, val) => !val || (val === '__none' ? !id : val.startsWith('T:') ? !!id && lType.get(id) === val.slice(2) : id === val);
  const filtered = () => {
    const q = norm(S.q), pq = norm(S.pq), min = S.minq === '' ? null : Number(S.minq);
    return invCache.rows.filter(r =>
      S.types.includes(r.type) &&
      (S.status === 'all' || (S.status === 'active' ? r.status !== 'cancelled' : r.status === S.status)) &&
      matchLoc(r.src, S.src) && matchLoc(r.dst, S.dst) &&
      (!S.any || matchLoc(r.src, S.any) || matchLoc(r.dst, S.any)) &&
      (!pq || norm(pName.get(r.pid)).includes(pq)) &&
      (!q || norm(`${r.docNo} ${r.reason}`).includes(q)) &&
      (min == null || r.qty >= min));
  };

  // ---- table models (shared by the screen and Excel export) ----
  const srcLbl = r => r.src ? locName(r.src) : r.type === 'opening' ? 'Opening balance' : '—';
  const dstLbl = r => r.dst ? locName(r.dst) : r.type === 'sale' ? 'Customer (sale)' : '—';
  const CELL = {
    date: r => ({t: r.date}), doc: r => ({t: r.docNo || '—'}), src: r => ({t: srcLbl(r)}), dst: r => ({t: dstLbl(r)}), product: r => ({t: pName.get(r.pid) || '—'}),
    type: r => ({t: INV_TYPES[r.type], h: `<span class="badge ${INV_TYPE_BADGE[r.type]}">${INV_TYPES[r.type]}</span>`}),
    qty: r => ({t: r.qty, n: 1}), rcv: r => ({t: r.rcv == null ? '' : r.rcv, n: 1}),
    status: r => ({t: INV_STATUS[r.status] || r.status, h: `<span class="badge ${INV_STATUS_BADGE[r.status] || 'b-draft'}">${INV_STATUS[r.status] || esc(r.status)}</span>`}),
    reason: r => ({t: r.reason || ''})
  };
  const sortVal = (r, k) => k === 'qty' ? r.qty : k === 'rcv' ? (r.rcv ?? -1) : CELL[k](r).t;

  const bucketRows = (rows, keyFn) => {
    const m = new Map();
    rows.forEach(r => invEffects(r).forEach(([loc, b, q]) => { const k = keyFn(loc, r); if (!k) return;
      const o = m.get(k) || {opening: 0, in: 0, sales: 0, out: 0, adj: 0}; o[b] += q; m.set(k, o); }));
    return m;
  };
  const net = o => o.opening + o.in - o.sales - o.out + o.adj;
  const aggHead = first => [first, 'Opening Stock', 'Received (in)', 'Sales', 'Sent out', 'Adjust / QC (net)', 'Net Change'];
  const aggRow = (name, o) => [name, o.opening, o.in, o.sales, o.out, o.adj, net(o)];

  const model = async (rows) => {
    if (S.view === 'loc') {
      const m = bucketRows(rows, loc => loc), live = new Map();
      (await liveStock()).forEach(r => live.set(r.location_id, (live.get(r.location_id) || 0) + Number(r.live_qty)));
      const ids = [...m.keys()].sort((a, b) => locName(a).localeCompare(locName(b)));
      return {head: aggHead('Location').concat('Live Stock (now)'), body: ids.map(id => aggRow(locName(id), m.get(id)).concat(live.get(id) || 0)), num: true,
        note: 'Live stock is the current balance as of now, whatever date range is selected. Stock still in transit is not counted at the destination until it is received.'};
    }
    if (S.view === 'prod') {
      const m = bucketRows(rows, (loc, r) => r.pid);
      const ids = [...m.keys()].sort((a, b) => (pName.get(a) || '').localeCompare(pName.get(b) || ''));
      return {head: aggHead('Product'), body: ids.map(id => aggRow(pName.get(id) || '—', m.get(id))), num: true,
        note: 'Product totals combine all locations in the filtered records, so a received transfer appears once as Sent out and once as Received.'};
    }
    const sorted = rows.slice().sort((a, b) => { const x = sortVal(a, S.sort.k), y = sortVal(b, S.sort.k); return (x < y ? -1 : x > y ? 1 : 0) * S.sort.d || (a.date < b.date ? 1 : -1); });
    return {head: S.cols.map(k => INV_COLS.find(c => c[0] === k)[1]), keys: S.cols, rows: sorted};
  };

  let lastModel = null, lastRows = [];
  const draw = async () => {
    const out = $('#ivOut'); lastRows = filtered();
    const all = bucketRows(lastRows, () => 'all').get('all') || {opening: 0, in: 0, sales: 0, out: 0, adj: 0};
    const tiles = `<div class="grid" style="margin-bottom:16px">
      <div class="tile"><small>Records</small><b>${fmt(lastRows.length)}</b></div><div class="tile"><small>Opening stock</small><b>${fmt(all.opening)}</b></div>
      <div class="tile"><small>Sales</small><b>${fmt(all.sales)}</b></div><div class="tile"><small>Sent out (challan / transfer / return)</small><b>${fmt(all.out)}</b></div>
      <div class="tile"><small>Received at destination</small><b>${fmt(all.in)}</b></div><div class="tile"><small>Adjust / QC (net)</small><b>${fmt(all.adj)}</b></div></div>`;
    const views = [['detail', 'All movements'], ['loc', 'By location'], ['prod', 'By product']];
    const bar = `<div class="row" style="margin-bottom:12px">${views.map(([k, n]) => `<button class="btn ${S.view === k ? '' : 'alt'}" data-v="${k}">${n}</button>`).join('')}<button class="btn alt" id="ivXl" style="margin-left:auto">Export to Excel</button></div>`;
    let body;
    try {
      lastModel = await model(lastRows);
      const m = lastModel;
      if (m.rows) {
        const shown = m.rows.slice(0, S.limit), totQ = m.rows.reduce((a, r) => a + r.qty, 0);
        const th = m.keys.map((k, i) => `<th class="${['qty', 'rcv'].includes(k) ? 'n' : ''}" data-s="${k}" style="cursor:pointer;white-space:nowrap">${m.head[i]}${S.sort.k === k ? (S.sort.d > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');
        const tr = shown.map(r => `<tr>${m.keys.map(k => { const c = CELL[k](r); return `<td class="${c.n ? 'n' : ''}">${c.h ?? (c.n ? fmt(c.t) : esc(c.t))}</td>`; }).join('')}</tr>`).join('');
        const qi = m.keys.indexOf('qty');
        body = m.keys.length ? `<div class="card"><div class="tablewrap"><table><thead><tr>${th}</tr></thead><tbody>${tr || `<tr><td colspan="${m.keys.length}" class="muted">No records match these filters.</td></tr>`}
          ${qi >= 0 && m.rows.length ? `<tr class="total">${m.keys.map((k, i) => i === 0 ? '<td>Total quantity (all matching records)</td>' : i === qi ? `<td class="n">${fmt(totQ)}</td>` : '<td></td>').join('')}</tr>` : ''}</tbody></table></div>
          ${m.rows.length > shown.length ? `<div class="row" style="margin-top:10px"><span class="muted">Showing ${fmt(shown.length)} of ${fmt(m.rows.length)} records.</span><button class="btn alt" id="ivMore">Show 200 more</button></div>` : ''}</div>`
          : '<div class="card"><div class="note warn">Select at least one column to show.</div></div>';
      } else {
        const tot = m.body.reduce((a, r) => r.map((x, i) => i ? (a[i] || 0) + x : ''), []);
        body = `<div class="card"><div class="tablewrap"><table><thead><tr>${m.head.map((h, i) => `<th class="${i ? 'n' : ''}">${h}</th>`).join('')}</tr></thead><tbody>
          ${m.body.map(r => `<tr>${r.map((c, i) => `<td class="${i ? 'n' : ''}">${i ? fmt(c) : esc(c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${m.head.length}" class="muted">No records match these filters.</td></tr>`}
          ${m.body.length ? `<tr class="total"><td>Total</td>${tot.slice(1).map(c => `<td class="n">${fmt(c)}</td>`).join('')}</tr>` : ''}</tbody></table></div>
          <p class="sub" style="margin:10px 0 0">${m.note}</p></div>`;
      }
    } catch (e) { body = `<div class="card"><div class="note err">${esc(e.message || e)}</div></div>`; }
    out.innerHTML = tiles + bar + body;
    out.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { S.view = b.dataset.v; draw(); });
    out.querySelectorAll('[data-s]').forEach(h => h.onclick = () => { S.sort = {k: h.dataset.s, d: S.sort.k === h.dataset.s ? -S.sort.d : (['date', 'qty', 'rcv'].includes(h.dataset.s) ? -1 : 1)}; draw(); });
    const more = $('#ivMore'); if (more) more.onclick = () => { S.limit += 200; draw(); };
    $('#ivXl').onclick = () => {
      if (!lastModel) return;
      const m = lastModel, aoa = m.rows ? [m.head].concat(m.rows.map(r => m.keys.map(k => CELL[k](r).t))) : [m.head].concat(m.body);
      downloadSheet(`Inventory_${({detail: 'Movements', loc: 'By_Location', prod: 'By_Product'})[S.view]}_${S.from}_to_${S.to}.xlsx`, aoa);
    };
  };

  // ---- data loading ----
  const load = async (force) => {
    if (S.from > S.to) return note($('#ivMsg'), 'The "From date" must not be after the "To date".', 'warn');
    note($('#ivMsg'), '');
    const key = `${S.from}|${S.to}`;
    if (force || invCache.key !== key) {
      $('#ivOut').innerHTML = loading;
      const res = await invFetch(S.from, S.to); invCache = {key, rows: res.rows, warn: res.warn};
    }
    if (invCache.warn.length) note($('#ivMsg'), `<b>Some data could not be loaded:</b><br>${invCache.warn.map(esc).join('<br>')}`, 'warn');
    await draw();
  };

  // ---- events ----
  pushUI(); fillPresets();
  const dateChanged = () => { S.from = $('#ivFrom').value; S.to = $('#ivTo').value; S.range = 'custom'; $('#ivRange').value = 'custom'; if (S.from && S.to) load(); };
  $('#ivFrom').onchange = dateChanged; $('#ivTo').onchange = dateChanged;
  $('#ivRange').onchange = () => { const r = invRange($('#ivRange').value); if (!r) { S.range = 'custom'; return; } S.range = $('#ivRange').value; [S.from, S.to] = r; pushUI(); load(); };
  $('#ivRefresh').onclick = () => load(true);

// ============================ IMPORT PLANNING ============================
// For imported (mostly organic, seasonal) products: when to place the next order so that the warehouse never runs out,
// respecting (a) supplier lead time + customs/clearance time, (b) the months in which the product can be ordered at all,
// (c) safety days, seasonal demand events and shelf life.
const MON_LBL = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const impS = {view: 'plan', p: {A: 14, B: 10, C: 7, clr: 7, tr: '0', so: true, sea: true, sup: '', abc: '', only: true, q: ''}};

function parseMonths(txt) {   // "Oct-Feb", "3,4,5", "All" -> sorted month numbers, or null for every month
  const s = String(txt ?? '').trim().toLowerCase();
  if (!s || ['all', 'any', 'all year', 'all months', 'every month', 'year round'].includes(s)) return null;
  const one = t => {
    t = t.trim();
    if (/^\d+$/.test(t)) { const n = +t; if (n < 1 || n > 12) throw new Error(`Month number "${t}" must be between 1 and 12.`); return n; }
    const i = t.length >= 3 ? MON_LBL.findIndex(m => t.startsWith(m.toLowerCase())) : -1;
    if (i < 0) throw new Error(`"${t}" is not a valid month. Use names like Oct, numbers like 10, or ranges like Oct-Feb.`);
    return i + 1;
  };
  const set = new Set();
  s.split(/[,;\/]+/).forEach(part => {
    part = part.trim(); if (!part) return;
    const m = part.split(/\s*[-–]\s*|\s+to\s+/);
    if (m.length === 2) { const a = one(m[0]), b = one(m[1]); for (let x = a; ; x = x % 12 + 1) { set.add(x); if (x === b) break; } }
    else if (m.length === 1) set.add(one(part));
    else throw new Error(`Cannot read "${part}". Use a range like Oct-Feb.`);
  });
  return set.size === 12 ? null : [...set].sort((a, b) => a - b);
}
function fmtMonths(a) {
  if (!a || !a.length || a.length >= 12) return 'All year';
  const on = Array(12).fill(false); a.forEach(m => on[m - 1] = true); const runs = [];
  for (let i = 0; i < 12; i++) if (on[i] && !on[(i + 11) % 12]) {
    let len = 0; while (on[(i + len) % 12] && len < 12) len++;
    runs.push(len === 1 ? MON_LBL[i] : `${MON_LBL[i]}–${MON_LBL[(i + len - 1) % 12]}`);
  }
  return runs.join(', ');
}
const monthOf = d => +d.slice(5, 7);
const okDate = (d, M) => !M || M.includes(monthOf(d));
const diffDays = (a, b) => Math.round((Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8, 10)) - Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8, 10))) / 86400000);
const prevOk = (d, M) => { for (let i = 0; i <= 366; i++) { const x = addDays(d, -i); if (okDate(x, M)) return x; } return null; };   // latest allowed day on or before d
const nextOk = (d, M) => { for (let i = 0; i <= 366; i++) { const x = addDays(d, i); if (okDate(x, M)) return x; } return null; };    // first allowed day on or after d
const blockEnd = (d, M) => { let x = d; for (let i = 0; i < 366 && okDate(addDays(x, 1), M); i++) x = addDays(x, 1); return x; };         // last day of the open window that contains d
const nextBlockStart = (d, M) => nextOk(addDays(blockEnd(d, M), 1), M);                                                                   // first day of the following window

// Plans one product. ctx = {today, P (screen settings), cls, sup, base (daily demand before factors), trend, events, wh, sp, tr, oo}
function impPlanRow(p, ctx) {
  const {today: td, P, cls, sup, events} = ctx;
  const lead = p.lead_time_days ?? sup?.lead_time_days ?? 14, clr = p.clearance_days ?? P.clr, L = lead + clr, review = sup?.review_days ?? 7;
  const safety = ({A: P.A, B: P.B, C: P.C, X: 0})[cls] ?? 0, M = p.order_months && p.order_months.length && p.order_months.length < 12 ? p.order_months : null;
  const pos = ctx.wh + ctx.sp + ctx.tr + ctx.oo, clamp = f => Math.min(4, Math.max(0.3, f));
  const evF = H => P.sea ? eventFactor(events, p, td, Math.max(1, Math.min(730, Math.round(H)))) : 1;
  const out = {p, cls, sup, lead, clr, L, review, safety, M, pos, wh: ctx.wh, sp: ctx.sp, tr: ctx.tr, oo: ctx.oo, D: 0, cover: Infinity, stockout: null, orderBy: null, arrival: null, gap: 0, qty: 0, lasts: 0, status: 'No demand', notes: []};
  const B = L + safety + (M ? 0 : review);   // days that must be covered: delivery time + safety (+ one review cycle when ordering is possible any time)
  let D = ctx.base * ctx.trend * clamp(evF(B));
  if (!(D > 0)) return out;
  const onhand = ctx.wh + ctx.sp + ctx.tr;   // stock that exists (open POs only count from the day they arrive)
  const arr = (ctx.arr || []).map(a => ({po: a.po, qty: a.qty, late: !!a.date && a.date < td, date: a.date ? (a.date < td ? addDays(td, 7) : a.date) : addDays(a.base || td, L)}));
  const sim = projectStock(onhand, D, arr, td), stockout = sim.runOut, cover = diffDays(td, stockout), latest = addDays(stockout, -B);
  let o;
  if (latest >= td) { o = M ? prevOk(latest, M) : latest; if (o < td) o = null; }
  if (o == null) o = okDate(td, M) ? td : nextOk(td, M);          // no allowed day left before the safe date: order at the first chance
  const arrival = addDays(o, L), gap = Math.max(0, diffDays(stockout, arrival));
  const T = M ? addDays(nextBlockStart(o, M), L + safety) : addDays(td, B);   // stock must last until the shipment of the next window / cycle has arrived
  D = ctx.base * ctx.trend * clamp(evF(diffDays(td, T)));
  const posA = projectStock(onhand, D, arr, td).projAt(diffDays(td, arrival));
  let qty = Math.max(0, Math.ceil(D * Math.max(0, diffDays(arrival, T)) - posA - 1e-9));
  if (qty > 0) { if (Number(p.moq) > 0) qty = Math.max(qty, Number(p.moq)); if (Number(p.pack_size) > 0) qty = Math.ceil(qty / Number(p.pack_size)) * Number(p.pack_size); }
  Object.assign(out, {D, cover, firstGap: sim.gaps[0] || null, stockout, orderBy: o, arrival, gap, qty, lasts: qty > 0 ? qty / D : 0, coverUntil: T});
  out.status = (gap > 0 || sim.gaps.length) ? 'Stock-out risk' : qty <= 0 ? 'Covered' : o <= addDays(td, 7) ? 'Order now' : o <= addDays(td, 30) ? 'Plan this month' : 'Upcoming';
  if (sim.gaps.length) { const g = sim.gaps[0], ep = addDays(td, L);
    out.notes.push(`Stock runs out on ${g.from}, but ${g.po ? 'PO ' + g.po : 'the open order'} is only expected on ${g.to}: about ${Math.round(g.days)} day(s) without stock (≈ ${fmt(Math.round(g.units))} units of sales at the current demand).`);
    out.notes.push(ep >= g.to ? `A new order placed today would arrive on ${ep}, after that shipment, so only an earlier or split shipment of the existing PO can close the gap.` : `A new order placed today would arrive on ${ep}, before that shipment.`);
    if (arr.some(a => a.late)) out.notes.push('An open PO is past its expected date; it is assumed to arrive in 7 days.');
    if (M && !okDate(td, M)) out.notes.push(`Outside the order window. If the supplier accepts an emergency order today, it would arrive on ${ep}.`); }
  if (gap > 0) out.notes.push(`Expected stock-out of about ${gap} day${gap === 1 ? '' : 's'} before the shipment can arrive.`);
  if (M && qty > 0) out.notes.push(okDate(td, M) ? `Order window is open until ${blockEnd(td, M)}.` : `Order window is closed; it opens on ${nextOk(td, M)}.`);
  if (qty > 0 && Number(p.shelf_life_days) > 0 && out.lasts > Number(p.shelf_life_days)) out.notes.push(`This order lasts ${Math.round(out.lasts)} days, longer than the ${p.shelf_life_days}-day shelf life. Consider splitting the shipment.`);
  return out;
}

async function renderAbc(v) {
  v.innerHTML = `<div class="card"><h2>ABC Analysis</h2><p class="sub">Products ranked by sales value (units × MRP). <b>A</b> = the products that make the first part of sales, <b>B</b> the next part, <b>C</b> the rest. <b>X</b> = no sales in the period; X with stock on hand is <b>dead stock</b>. Distribution &amp; Forecasting uses the last ${ABC_DAYS} days with A = 80%, B = 95% for class-wise rules.</p>
    <div class="row"><div><label>Sales period</label><select id="abD">${[30, 60, 90, 180, 365].map(d => `<option value="${d}" ${d === ABC_DAYS ? 'selected' : ''}>Last ${d} days</option>`).join('')}</select></div>
    <div><label>A up to (% of sales)</label><input type="number" id="abA" value="80" min="1" max="99" style="min-width:0;width:90px"></div><div><label>B up to (% of sales)</label><input type="number" id="abB" value="95" min="2" max="100" style="min-width:0;width:90px"></div>

  let data = null;
  const draw = () => {
    if (!data) return; const f = $('#abC').value, list = data.items.filter(i => !f || i.cls === f), cnt = c => data.items.filter(i => i.cls === c);
    const dead = cnt('X').filter(i => i.stock > 0), share = c => cnt(c).reduce((a, i) => a + i.share, 0);
    $('#abOut').innerHTML = `<div class="grid" style="margin-bottom:14px">${['A', 'B', 'C'].map(c => `<div class="tile"><small>Class ${c}</small><b>${cnt(c).length} products</b><small>${share(c).toFixed(1)}% of sales</small></div>`).join('')}
      <div class="tile"><small>Dead stock (no sales, stock on hand)</small><b>${dead.length} products</b><small>${fmt(dead.reduce((a, i) => a + i.stock, 0))} units${data.useVal ? ' · Tk ' + fmt(dead.reduce((a, i) => a + i.stock * (Number(i.p.mrp) || 0), 0)) : ''}</small></div></div>
      <div class="card"><div class="tablewrap"><table><thead><tr><th class="n">#</th><th>Code</th><th>Product</th><th>Category</th><th>Class</th><th class="n">Units sold</th><th class="n">${data.useVal ? 'Sales value (Tk)' : 'Value'}</th><th class="n">Share %</th><th class="n">Cumulative %</th><th class="n">Stock (all locations)</th><th class="n">Days of stock</th><th>Note</th></tr></thead><tbody>
      ${list.map(i => `<tr><td class="n">${i.rank ?? ''}</td><td>${esc(i.p.sku || '')}</td><td>${esc(i.p.name)}</td><td>${esc(i.p.category || '')}</td><td><span class="badge ${CLS_BADGE[i.cls]}">${i.cls}</span></td><td class="n">${fmt(i.qty)}</td><td class="n">${fmt(i.value)}</td><td class="n">${i.cls === 'X' ? '' : i.share.toFixed(2)}</td><td class="n">${i.cls === 'X' ? '' : i.cum.toFixed(1)}</td><td class="n">${fmt(i.stock)}</td><td class="n">${i.days == null ? '—' : fmt(i.days)}</td><td>${i.note}</td></tr>`).join('') || '<tr><td colspan="12" class="muted">No products.</td></tr>'}
      </tbody></table></div></div>`;
  };

    const days = +$('#abD').value, aCut = +$('#abA').value, bCut = +$('#abB').value;

    const r = abcCompute(new Map(rows.map(x => [x.prod_id, Number(x.qty)])), aCut, bCut);

  const draw = () => {

    $('#roT').innerHTML = `<div class="card"><div class="tablewrap"><table><thead><tr><th></th><th>Product</th><th>Supplier</th><th class="n">Warehouse</th><th class="n">Sales points</th><th class="n">In-transit</th><th class="n">On order</th><th class="n">Demand / day</th><th class="n">Cover (days)</th><th class="n">Lead time</th><th>Order by</th><th>Status</th><th class="n">Order qty</th><th class="n">Last cost</th><th class="n">Value</th></tr></thead><tbody>
      ${list.map(r => { const late = r.orderBy && r.orderBy < today(); return `<tr><td><input type="checkbox" data-k="${r.p.id}" ${chk.has(r.p.id) ? 'checked' : ''} ${r.qty > 0 ? '' : 'disabled'}></td><td>${esc(r.p.name)} <span class="badge ${CLS_BADGE[r.cls]}">${r.cls}</span></td>

        <td class="n">${fmt(r.D)}</td><td class="n">${Number.isFinite(r.cover) ? fmt(r.cover) : '—'}</td><td class="n">${r.lead}</td><td style="white-space:nowrap;${late ? 'color:#b91c1c' : ''}">${r.orderBy ? (late ? 'Late — ' : '') + r.orderBy : ''}</td><td><span class="badge ${ST[r.status]}">${r.status}</span></td>
        <td class="n">${r.qty > 0 ? `<input type="number" min="0" step="any" data-q="${r.p.id}" value="${qOf(r)}" style="min-width:0;width:90px;text-align:right">` : '0'}</td><td class="n">${r.cost == null ? '' : fmt(r.cost)}</td><td class="n" id="rv_${r.p.id}">${r.cost == null || !qOf(r) ? '' : fmt(qOf(r) * r.cost)}</td></tr>`; }).join('') || '<tr><td colspan="15" class="muted">Nothing to order with these settings.</td></tr>'}
      </tbody></table></div></div>`;
    $('#roT').querySelectorAll('[data-k]').forEach(c => c.onchange = () => { c.checked ? chk.add(c.dataset.k) : chk.delete(c.dataset.k); kpi(); });

      $('#rv_' + r.p.id).textContent = r.cost == null || !n ? '' : fmt(n * r.cost); kpi(); });

  };
  const recalc = () => { rows = calc(); qtyEdit = new Map(); chk = new Set(rows.filter(r => r.qty > 0 && (r.status === 'Urgent' || r.status === 'Order now')).map(r => r.p.id)); draw(); };
  ['roA', 'roB', 'roC', 'roTr', 'roSo', 'roSea'].forEach(id => $('#' + id).oninput = recalc); ['roSup', 'roAbc', 'roOnly'].forEach(id => $('#' + id).oninput = draw);

    sel.forEach(r => { if (!r.sup) { missing.add(r.p.supplier || '(no supplier)'); return; } if (!groups.has(r.sup.id)) groups.set(r.sup.id, {sup: r.sup, lines: []}); groups.get(r.sup.id).lines.push({product_id: r.p.id, qty: qOf(r), unit_cost: r.cost ?? null}); });
    if (missing.size) return toast(`Add these suppliers in Master Data → Suppliers first: ${[...missing].join(', ')}`, 'err');
    const wh = $('#roWh').value; if (!wh) return toast('Choose the receiving warehouse.', 'err');
    openForm(`Create ${groups.size} draft purchase order(s)`, [{k: 'info', label: 'Summary', value: [...groups.values()].map(g => `${g.sup.name}: ${g.lines.length} products`).join(' · '), readonly: true},
      {k: 'date', label: 'PO date', type: 'date', value: today()}, {k: 'note', label: 'Note (optional)'}], async f => {
      const made = [];
      try { for (const g of groups.values()) {
        const {data, error} = await db.rpc('create_po', {p_supplier: g.sup.id, p_warehouse: wh, p_date: f.date || today(), p_expected: addDays(f.date || today(), g.sup.lead_time_days), p_note: f.note || null, p_lines: g.lines});
        if (error) throw new Error(`${g.sup.name}: ${error.message}`); made.push(data); }
      } catch (e) { throw new Error(e.message + (made.length ? ` (Already created: ${made.join(', ')})` : '')); }
      toast(`${made.length} draft PO(s) created: ${made.join(', ')}`); await showTab('po');
    });
  };
  recalc();
}

function poDialog(po, lines, ctx) {

  ov.innerHTML = `<div class="box" style="width:min(940px,96vw)"><h3>${esc(po.po_no)} — ${esc(ctx.supName(po.supplier_id))} <span class="badge b-${po.status}">${PO_STATUS[po.status]}</span></h3>

    <div class="tablewrap"><table style="min-width:0"><thead><tr><th>Product</th><th class="n">Ordered</th>${draft ? '' : '<th class="n">Received</th><th class="n">Balance</th>'}<th class="n">Unit cost</th><th class="n">Value</th></tr></thead><tbody>

    ${canRecv ? `<div class="row" style="margin-top:12px"><div><label>Expected delivery (change it when the supplier gives a new date)</label><input type="date" id="pdEta" value="${po.expected_date || ''}"></div><div><label>Reason (optional)</label><input type="text" id="pdEtaN" style="min-width:220px"></div><button class="btn alt" id="pdEtaSave">Update expected date</button></div>` : ''}
    <div id="grnBox"></div><div id="ovM"></div>
    <div class="row" style="margin-top:14px">${draft ? '<button class="btn" id="pdSave">Save changes</button><button class="btn" id="pdOrder">Mark as Ordered</button><button class="btn danger" id="pdCancel">Cancel PO</button>' : ''}

    <button class="btn alt" id="pdPrint">Print</button><button class="btn alt" id="ovC">Close</button></div></div>`;
  document.body.appendChild(ov); $('#ovC').onclick = () => ov.remove(); $('#pdPrint').onclick = () => printPO(po, lines, ctx);
  const act = async (fn, okMsg) => { try { await fn(); ov.remove(); toast(okMsg); await showTab('po'); } catch (e) { note($('#ovM'), esc(e.message || e), 'err'); } };
  const status = async a => { const {error} = await db.rpc('po_set_status', {p_po: po.id, p_action: a}); if (error) throw error; };
  const save = async () => {
    const out = lines.map(l => ({product_id: l.product_id, qty: Number(ov.querySelector(`[data-pq="${l.product_id}"]`).value), unit_cost: ov.querySelector(`[data-pc="${l.product_id}"]`).value === '' ? null : Number(ov.querySelector(`[data-pc="${l.product_id}"]`).value)})).filter(l => l.qty > 0);

    $('#grnBox').innerHTML = `<h3 style="margin:14px 0 6px">Goods received (GRN)</h3><div class="tablewrap"><table style="min-width:0"><thead><tr><th>GRN</th><th>Date</th><th>Supplier ref</th><th>Product</th><th class="n">Qty</th><th>Batch</th><th>Expiry</th></tr></thead><tbody>

  })();
}
function poReceiveDialog(po, lines) {

  ov.innerHTML = `<div class="box" style="width:min(940px,96vw)"><h3>Receive goods — ${esc(po.po_no)}</h3><p class="sub">Enter what actually arrived at ${esc(locName(po.warehouse_id))}. Leave 0 for products that did not come. Batch and expiry are recorded for traceability.</p>

    ${open.map(l => { const bal = Number(l.ordered_qty) - Number(l.received_qty); return `<tr data-p="${l.product_id}" data-b="${bal}"><td>${esc(prodName(l.product_id))}</td><td class="n">${fmt(bal)}</td><td class="n"><input type="number" min="0" step="any" class="rq" value="${bal}" style="min-width:0;width:90px;text-align:right"></td><td><input type="text" class="rb" style="min-width:0;width:120px"></td><td><input type="date" class="re" style="min-width:0;width:150px"></td></tr>`; }).join('')}</tbody></table></div>
    <div id="ovM"></div><div class="row" style="margin-top:14px"><button class="btn" id="rcOk">Confirm Receipt</button><button class="btn alt" id="ovC">Cancel</button></div></div>`;
  document.body.appendChild(ov); $('#ovC').onclick = () => ov.remove();
  $('#rcOk').onclick = async () => {
    const out = [...ov.querySelectorAll('tbody tr')].map(tr => ({product_id: tr.dataset.p, qty: Number(tr.querySelector('.rq').value), batch_no: tr.querySelector('.rb').value.trim() || null, expiry_date: tr.querySelector('.re').value || null, bal: Number(tr.dataset.b)})).filter(l => l.qty > 0);

const delErr = e => e.code === '23503' ? 'Cannot delete: it already has stock, sales or indent records. Set it to Inactive instead.' : (e.message || e);
async function bulkDelete(table, ids) {
  let ok = 0, fail = 0;
  for (let i = 0; i < ids.length; i += 10) {
    const rs = await Promise.all(ids.slice(i, i + 10).map(id => db.from(table).delete().eq('id', id).select('id')));
    rs.forEach(r => (r.error || !r.data || !r.data.length) ? fail++ : ok++);
  }
  return {ok, fail};
}
async function deleteAllFlow(table, label, ids) {
  if (!ids.length) return toast('Nothing to delete.', 'err');
  if (prompt(`This will try to delete ALL ${ids.length} ${label}.\nRows that already have stock, sales or indent history cannot be deleted and will be skipped.\n\nType DELETE to confirm:`) !== 'DELETE') return;
  const r = await bulkDelete(table, ids);
  toast(`${r.ok} deleted${r.fail ? `, ${r.fail} skipped (have history or no permission)` : ''}.`, r.fail && !r.ok ? 'err' : 'ok');
}
